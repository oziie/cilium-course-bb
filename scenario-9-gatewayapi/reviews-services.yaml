# One Service per reviews version, so an HTTPRoute can weight them.
# The Bookinfo "reviews" Service selects all three versions at once.
apiVersion: v1
kind: Service
metadata:
  name: reviews-v1
  namespace: default
spec:
  selector:
    app: reviews
    version: v1
  ports:
    - name: http
      port: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v2
  namespace: default
spec:
  selector:
    app: reviews
    version: v2
  ports:
    - name: http
      port: 9080
