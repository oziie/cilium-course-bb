# Cilium Helm values for Scenario 9 (Gateway API).
# Scenario 1 settings plus kube-proxy replacement, L2 announcements and
# Gateway API support. create-kind-cluster.sh also sets cluster.name,
# k8sServiceHost and k8sServicePort, which kube-proxy replacement needs.
# The Gateway API CRDs must exist before Cilium is installed.
operator:
  replicas: 1
routingMode: tunnel
tunnelProtocol: vxlan
kubeProxyReplacement: true
l2announcements:
  enabled: true
ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
