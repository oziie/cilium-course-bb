<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">What a CNI plugin does when a pod starts</text>

  <!-- top chain -->
  <g font-size="17" text-anchor="middle">
    <rect x="40" y="80" width="220" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="150" y="111" font-weight="700" fill="#111827">kube-apiserver</text>
    <text x="150" y="134" font-size="14" fill="#4B5563">a new pod is scheduled</text>

    <rect x="330" y="80" width="220" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="440" y="111" font-weight="700" fill="#111827">kubelet</text>
    <text x="440" y="134" font-size="14" fill="#4B5563">on the chosen node</text>

    <rect x="620" y="80" width="220" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="730" y="111" font-weight="700" fill="#111827">container runtime</text>
    <text x="730" y="134" font-size="14" fill="#4B5563">containerd, CRI-O</text>

    <rect x="910" y="80" width="250" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <text x="1035" y="111" font-weight="700" fill="#111827">CNI plugin</text>
    <text x="1035" y="134" font-size="14" fill="#4B5563">e.g. Cilium</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="260" y1="115" x2="328" y2="115"/>
    <line x1="550" y1="115" x2="618" y2="115"/>
    <line x1="840" y1="115" x2="908" y2="115"/>
  </g>
  <text x="875" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">CNI ADD</text>

  <!-- legend of what the plugin does -->
  <path d="M1035,150 L1035,175 L600,175 L600,192" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <rect x="40" y="196" width="1120" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <g font-size="16" fill="#111827">
    <circle cx="70" cy="218" r="13" fill="#D97706"/><text x="70" y="224" text-anchor="middle" fill="#FFF" font-weight="700">1</text>
    <text x="92" y="224">network interface for the pod (veth pair)</text>
    <circle cx="450" cy="218" r="13" fill="#D97706"/><text x="450" y="224" text-anchor="middle" fill="#FFF" font-weight="700">2</text>
    <text x="472" y="224">an IP address (IPAM)</text>
    <circle cx="700" cy="218" r="13" fill="#D97706"/><text x="700" y="224" text-anchor="middle" fill="#FFF" font-weight="700">3</text>
    <text x="722" y="224">routes + datapath to every other pod and Service</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="265" width="540" height="345" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="60" y="292" font-size="18" font-weight="700" fill="#374151">Node 1</text>
    <rect x="620" y="265" width="540" height="345" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="640" y="292" font-size="18" font-weight="700" fill="#374151">Node 2</text>
  </g>
  <g font-size="16" text-anchor="middle">
    <!-- pods node 1 -->
    <rect x="80" y="310" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="180" y="342" font-weight="700" fill="#111827">Pod A</text>
    <text x="180" y="372" font-size="15" fill="#4B5563">eth0 10.244.1.12</text>
    <rect x="340" y="310" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="440" y="342" font-weight="700" fill="#111827">Pod B</text>
    <text x="440" y="372" font-size="15" fill="#4B5563">eth0 10.244.1.30</text>
    <!-- pods node 2 -->
    <rect x="660" y="310" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="760" y="342" font-weight="700" fill="#111827">Pod C</text>
    <text x="760" y="372" font-size="15" fill="#4B5563">eth0 10.244.2.7</text>
    <rect x="920" y="310" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    <text x="1020" y="342" font-weight="700" fill="#111827">Pod D</text>
    <text x="1020" y="372" font-size="15" fill="#4B5563">eth0 10.244.2.9</text>
  </g>
  <!-- veth lines -->
  <g stroke="#374151" stroke-width="3">
    <line x1="180" y1="400" x2="180" y2="460"/><line x1="440" y1="400" x2="440" y2="460"/>
    <line x1="760" y1="400" x2="760" y2="460"/><line x1="1020" y1="400" x2="1020" y2="460"/>
  </g>
  <g font-size="13" fill="#4B5563">
    <text x="190" y="436">veth</text><text x="450" y="436">veth</text>
    <text x="770" y="436">veth</text><text x="1030" y="436">veth</text>
  </g>
  <!-- host netns -->
  <rect x="60" y="460" width="500" height="54" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="310" y="493" text-anchor="middle" font-size="15" fill="#111827">host network namespace: routes + datapath</text>
  <rect x="640" y="460" width="500" height="54" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="890" y="493" text-anchor="middle" font-size="15" fill="#111827">host network namespace: routes + datapath</text>
  <!-- node NICs -->
  <rect x="210" y="540" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <text x="310" y="568" text-anchor="middle" font-size="15" fill="#111827">eth0 172.18.0.3</text>
  <rect x="790" y="540" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <text x="890" y="568" text-anchor="middle" font-size="15" fill="#111827">eth0 172.18.0.4</text>
  <g stroke="#374151" stroke-width="2"><line x1="310" y1="514" x2="310" y2="540"/><line x1="890" y1="514" x2="890" y2="540"/></g>
  <line x1="410" y1="562" x2="788" y2="562" stroke="#D97706" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- numbered markers -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#FFF">
    <circle cx="160" cy="430" r="13" fill="#D97706"/><text x="160" y="436">1</text>
    <circle cx="290" cy="368" r="13" fill="#D97706"/><text x="290" y="374">2</text>
    <circle cx="80" cy="487" r="13" fill="#D97706"/><text x="80" y="493">3</text>
  </g>

  <text x="600" y="648" text-anchor="middle" font-size="16" fill="#374151">Pod A → Pod C: the CNI's datapath carries the packet from one node to the other (routing or an overlay tunnel)</text>
</svg>
