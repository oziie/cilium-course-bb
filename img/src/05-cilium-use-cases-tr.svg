<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="680" fill="#FFFFFF"/>
<text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Cilium ne için kullanılır</text>
<rect x="40" y="80" width="530" height="260" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="70" y="120" font-size="22" font-weight="700" fill="#1E40AF">Ağ</text>
<text x="70" y="156" font-size="16" fill="#111827">•  Pod'dan pod'a bağlantı (CNI)</text>
<text x="70" y="182" font-size="16" fill="#111827">•  kube-proxy replacement (eBPF Service'leri)</text>
<text x="70" y="208" font-size="16" fill="#111827">•  LB-IPAM, L2 ve BGP duyuruları</text>
<text x="70" y="234" font-size="16" fill="#111827">•  Ingress ve Gateway API</text>
<text x="70" y="260" font-size="16" fill="#111827">•  Egress Gateway (sabit kaynak IP)</text>
<text x="70" y="286" font-size="16" fill="#111827">•  Cluster Mesh (çoklu küme)</text>
<text x="70" y="320" font-size="14" font-weight="700" fill="#1E40AF">Bu kursta: Senaryo 1–3, 7–10</text>
<rect x="630" y="80" width="530" height="260" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="720" y="120" font-size="22" font-weight="700" fill="#991B1B">Güvenlik</text>
<text x="720" y="156" font-size="16" fill="#111827">•  Kimlik tabanlı ağ politikaları (L3/L4)</text>
<text x="720" y="182" font-size="16" fill="#111827">•  L7 politikaları: HTTP metot/yolları, DNS adları</text>
<text x="720" y="208" font-size="16" fill="#111827">•  Şeffaf şifreleme (WireGuard, IPsec)</text>
<text x="720" y="234" font-size="16" fill="#111827">•  Tetragon ile çalışma zamanı güvenliği</text>
<text x="720" y="320" font-size="14" font-weight="700" fill="#991B1B">Bu kursta: Senaryo 4–5</text>
<rect x="40" y="380" width="530" height="260" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="70" y="420" font-size="22" font-weight="700" fill="#166534">Gözlemlenebilirlik</text>
<text x="70" y="456" font-size="16" fill="#111827">•  Hubble: her akış, kimlikleriyle birlikte</text>
<text x="70" y="482" font-size="16" fill="#111827">•  Politika kararları ve drop nedenleri</text>
<text x="70" y="508" font-size="16" fill="#111827">•  Service haritası (Hubble UI)</text>
<text x="70" y="534" font-size="16" fill="#111827">•  Prometheus metrikleri</text>
<text x="70" y="620" font-size="14" font-weight="700" fill="#166534">Bu kursta: Senaryo 6, 11</text>
<rect x="630" y="380" width="530" height="260" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="720" y="420" font-size="22" font-weight="700" fill="#5B21B6">Service mesh</text>
<text x="720" y="456" font-size="16" fill="#111827">•  Sidecar olmadan L7 trafik yönetimi</text>
<text x="720" y="482" font-size="16" fill="#111827">•  Canary sürümler ve trafik bölme</text>
<text x="720" y="508" font-size="16" fill="#111827">•  Servisler arası karşılıklı kimlik doğrulama</text>
<text x="720" y="534" font-size="16" fill="#111827">•  Ortak giriş noktası olarak Gateway API</text>
<text x="720" y="620" font-size="14" font-weight="700" fill="#5B21B6">Bu kursta: Senaryo 9</text>
<circle cx="600" cy="360" r="78" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<circle cx="600" cy="360" r="86" fill="none" stroke="#FFFFFF" stroke-width="8"/>
<text x="600" y="356" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Cilium</text>
<text x="600" y="382" text-anchor="middle" font-size="15" fill="#92400E">eBPF tabanlı</text>
</svg>
