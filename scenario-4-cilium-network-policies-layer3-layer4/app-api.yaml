# Backend API: nginx serving the public API on 8080 and an internal admin
# endpoint on 9090. Policies will expose 8080 to the frontend and keep 9090 closed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx-conf
  namespace: backend
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        default_type application/json;
        return 200 '{"service":"api","status":"ok"}\n';
      }
    }
    server {
      listen 9090;
      location / {
        default_type text/plain;
        return 200 'api admin endpoint\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: api-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: admin
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
