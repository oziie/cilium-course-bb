# Same policy as cnp-01, plus one rule: DELETE /api/orders/<id> is allowed only when
# the request carries the header "X-Team: ops".
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-web-to-api-http
  namespace: backend
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: frontend
            app.kubernetes.io/name: web
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/api/products"
              - method: GET
                path: "/api/orders"
              - method: POST
                path: "/api/orders"
              - method: DELETE
                path: "/api/orders/[0-9]+"
                headers:
                  - "X-Team: ops"
