kind: Cluster # Declares a kind cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
- role: worker
networking:
  disableDefaultCNI: true # Disables kindnetd prior to Cilium install
# Scenario 7: IPAM is configured on Cilium, not on kind. kind rejects unknown
# fields, so the cluster-pool settings live in cilium-values.yaml, which
# create-kind-cluster.sh passes to helm:
#   ipam.mode: cluster-pool
#   ipam.operator.clusterPoolIPv4MaskSize: 29
#   ipam.operator.clusterPoolIPv4PodCIDRList: [10.0.42.0/28, 10.0.84.0/28]
